<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base" content="https://api.drafted.world">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>Videos | trax</title>
	<link rel="stylesheet" href="style.css?v=20260902b">
</head>
<body>
	<main class="container content-page">
		<a class="back-link" href="index.html">&larr; back</a>
		<div class="videos-header">
			<h2>Videos</h2>
			<span id="videoCount" class="card-sub">—</span>
		</div>
		<div class="video-filters" role="toolbar" aria-label="Filter videos">
			<div class="filter-row filter-row--days">
				<span class="filter-row__label" aria-hidden="true">Day</span>
				<div class="day-pills" id="dayPills" role="group" aria-label="Filter by Day">
					<button type="button" class="day-pill is-active" data-day="" aria-pressed="true">All</button>
					<button type="button" class="day-pill" data-day="Day 1" aria-pressed="false">Day 1</button>
					<button type="button" class="day-pill" data-day="Day 2" aria-pressed="false">Day 2</button>
					<button type="button" class="day-pill" data-day="Day 3" aria-pressed="false">Day 3</button>
					<button type="button" class="day-pill" data-day="Day 4" aria-pressed="false">Day 4</button>
				</div>
			</div>
			<div class="filter-row filter-row--topics">
				<span class="filter-row__label" aria-hidden="true">Topic</span>
				<div class="topic-pills" id="topicPills" role="group" aria-label="Filter by Topic"></div>
			</div>
			<p class="filter-result" id="filterResult" aria-live="polite">Showing all videos</p>
		</div>
		<!-- hero removed — thumbnail grid only -->
		<p id="video-status" class="lede">Loading videos...</p>
		<p><a id="video-login" class="back-link" href="/auth/discord" hidden>Sign in with Discord</a></p>
		<section id="videoGrid" class="sections video-list" aria-live="polite" aria-label="Video thumbnail grid"></section>
	</main>

	<div id="videoModal" class="video-modal hidden" aria-labelledby="videoModalTitle">
		<div class="video-modal-backdrop" id="videoModalBackdrop"></div>
		<div class="video-modal-card">
			<button id="videoModalClose" class="video-modal-close" type="button" aria-label="Close player">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 18L18 6M6 6l12 12"/></svg>
			</button>
			<div class="video-modal-stage" id="videoModalStage">
				<video id="videoModalPlayer" preload="metadata" playsinline></video>
				<div class="video-modal-loader hidden" id="videoModalLoader">
					<div class="video-modal-spinner"></div>
					<span>Loading…</span>
				</div>
			</div>
			<div class="video-modal-info">
				<h3 id="videoModalTitle" class="video-modal-title">—</h3>
				<p id="videoModalMeta" class="video-modal-meta">—</p>
			</div>
			<div class="video-player-controls" id="videoModalControls">
				<div class="video-player-timeline-row">
					<span id="videoModalCurrent" class="video-player-timeline__time video-player-timeline__time--current">00:00</span>
					<div class="video-player-timeline" id="videoModalTimeline">
						<div class="video-player-timeline__track">
							<div id="videoModalFill" class="video-player-timeline__fill"></div>
							<div id="videoModalThumb" class="video-player-timeline__thumb" aria-hidden="true"></div>
						</div>
						<input id="videoModalProgress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
					</div>
					<span id="videoModalDuration" class="video-player-timeline__time video-player-timeline__time--duration">00:00</span>
				</div>
				<div class="video-player-bar">
					<div class="video-player-bar__left">
						<button id="videoModalPrev" class="icon-btn" type="button" aria-label="Previous video">
							<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M11 19l-7-7 7-7"/><path d="M21 12H4"/><path d="M11 5l-7 7 7 7" style="display:none"/><polygon points="11 5 6 12 11 19" fill="currentColor" stroke="none"/><rect x="15" y="5" width="2" height="14" rx="1" fill="currentColor"/></svg>
						</button>
						<button id="videoModalPlay" class="icon-btn icon-btn--primary video-player-play" type="button" aria-label="Play">
							<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
						</button>
						<button id="videoModalNext" class="icon-btn" type="button" aria-label="Next video">
							<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><polygon points="13 5 18 12 13 19" fill="currentColor" stroke="none"/><rect x="6" y="5" width="2" height="14" rx="1" fill="currentColor"/></svg>
						</button>
					</div>
					<div class="video-player-bar__right">
						<button id="videoModalMute" class="icon-btn" type="button" aria-label="Mute">
							<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 5V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19 6a9 9 0 010 12"/></svg>
						</button>
						<input id="videoModalVolume" type="range" min="0" max="1" step="0.05" value="1" class="video-player-volume" aria-label="Volume" />
						<button id="videoModalFullscreen" class="icon-btn" type="button" aria-label="Fullscreen">
							<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 9V5h4M21 9V5h-4M3 15v4h4M21 15v4h-4"/></svg>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="config.js"></script>
	<script src="videos.js?v=20260902c"></script>
</body>
</html>
