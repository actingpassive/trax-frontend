<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base" content="https://api.drafted.world">
	<title>Videos | trax</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="container content-page">
		<a class="back-link" href="index.html">&larr; back</a>
		<div class="videos-header">
			<h2>Videos</h2>
			<div class="card-head__right">
				<span id="videoCount" class="card-sub">—</span>
				<div class="view-toggle" role="group" aria-label="View mode">
					<button type="button" class="view-toggle__btn active" data-view-mode="list" aria-label="List view" aria-pressed="true">
						<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="1" y="2" width="11" height="2" rx="1"/><rect x="1" y="7" width="11" height="2" rx="1"/><rect x="1" y="12" width="11" height="2" rx="1"/><circle cx="14.5" cy="3" r="1.2"/><circle cx="14.5" cy="8" r="1.2"/><circle cx="14.5" cy="13" r="1.2"/></svg>
					</button>
					<button type="button" class="view-toggle__btn" data-view-mode="grid" aria-label="Grid view" aria-pressed="false">
						<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.2"/><rect x="9" y="1" width="6" height="6" rx="1.2"/><rect x="1" y="9" width="6" height="6" rx="1.2"/><rect x="9" y="9" width="6" height="6" rx="1.2"/></svg>
					</button>
				</div>
			</div>
		</div>
		<div class="video-filters" role="toolbar" aria-label="Filter videos">
			<div class="filter-row filter-row--days">
				<span class="filter-row__label" aria-hidden="true">Day</span>
				<div class="day-pills" id="dayPills" role="group" aria-label="Filter by Day">
					<button type="button" class="day-pill is-active" data-day="" aria-pressed="true">All</button>
					<button type="button" class="day-pill" data-day="Day 1" aria-pressed="false">Day 1</button>
					<button type="button" class="day-pill" data-day="Day 2" aria-pressed="false">Day 2</button>
					<button type="button" class="day-pill" data-day="Day 3" aria-pressed="false">Day 3</button>
					<button type="button" class="day-pill" data-day="Day 4" aria-pressed="false">Day 4</button>
				</div>
			</div>
			<div class="filter-row filter-row--topics">
				<span class="filter-row__label" aria-hidden="true">Topic</span>
				<div class="topic-pills" id="topicPills" role="group" aria-label="Filter by Topic"></div>
			</div>
			<p class="filter-result" id="filterResult" aria-live="polite">Showing all videos</p>
		</div>
		<section id="video-hero" class="video-hero" hidden aria-label="Featured video"></section>
		<p id="video-status" class="lede">Loading videos...</p>
		<p><a id="video-login" class="back-link" href="/auth/discord" hidden>Sign in with Discord</a></p>
		<section id="video-list" class="sections video-list" aria-live="polite"></section>
	</main>

	<script src="config.js"></script>
	<script src="videos.js"></script>
</body>
</html>
